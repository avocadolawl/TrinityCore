name: mmaps_generator (Windows x64)

# Builds only the map tools (mmaps_generator and the extractors) for Windows and uploads them.
# Run it from the Actions tab (Run workflow) or by pushing to a claude/* branch.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'src/common/mmaps_common/**'
      - 'src/tools/**'
      - '.github/workflows/mmaps-generator-win.yml'

jobs:
  build:
    runs-on: windows-latest
    env:
      CMAKE_BUILD_TYPE: Release
      OPENSSL_ROOT_DIR: C:/libs/openssl
    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Get current OpenSSL version
      id: openssl-info
      run: |
        $VersionsUrl = "https://api.github.com/repos/slproweb/opensslhashes/contents/win32_openssl_hashes.json"
        $Headers = @{
          Accept="application/vnd.github.raw+json"
          Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"
        }
        $openSSL = (Invoke-RestMethod $VersionsUrl -Headers $Headers).files.PSObject.Properties |
          Select-Object -ExpandProperty Value |
          Where-Object { $_.arch -eq 'INTEL' } |
          Where-Object { $_.bits -eq '64' } |
          Where-Object { $_.light -eq $false } |
          Where-Object { $_.installer  -eq 'exe' } |
          Sort-Object -Descending @{ Expression = { [version]$_.basever } } |
          Select-Object -First 1
        [System.String]::Format("cache-key=openssl-{0}-win-{1}-{2}", $openSSL.basever, $openSSL.arch, $openSSL.bits) >> $env:GITHUB_OUTPUT
        [System.String]::Format("url={0}", $openSSL.url) >> $env:GITHUB_OUTPUT

    - name: Cache OpenSSL
      id: cache-openssl
      uses: actions/cache@v6
      with:
        path: ${{ env.OPENSSL_ROOT_DIR }}
        key: ${{ steps.openssl-info.outputs.cache-key }}

    - name: Download and install Openssl 3.x
      if: ${{ steps.cache-openssl.outputs.cache-hit != 'true' }}
      run: |
        (New-Object System.Net.WebClient).DownloadFile("${{ steps.openssl-info.outputs.url }}", "${{ env.TEMP }}\openssl.exe")
        Start-Process -Wait -FilePath "${{ env.TEMP }}\openssl.exe" "/SILENT","/SP-","/SUPPRESSMSGBOXES",/DIR=${{ env.OPENSSL_ROOT_DIR }}
        & ${{ env.OPENSSL_ROOT_DIR }}/bin/openssl.exe version

    - name: Download and install Boost
      uses: MarkusJx/install-boost@v2
      id: install-boost
      with:
        boost_version: 1.84.0
        link: static
        platform_version: 2022
        toolset: msvc

    - name: Initialize Visual Studio Environment
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Configure CMake
      env:
        BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
      run: >
        cmake -GNinja -S ${{ github.workspace }} -B ${{ steps.strings.outputs.build-output-dir }}
        -DSERVERS=OFF -DTOOLS=ON -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

    - name: Build
      run: |
        cmake --build ${{ steps.strings.outputs.build-output-dir }} --target mmaps_generator mapextractor vmap4extractor vmap4assembler

    - name: Collect files
      run: |
        $out = "${{ github.workspace }}/mmaps-tools"
        New-Item -ItemType Directory -Force -Path $out | Out-Null
        $bin = "${{ steps.strings.outputs.build-output-dir }}/bin"
        Get-ChildItem -Path $bin -Recurse -Include *.exe,*.dll | Copy-Item -Destination $out
        Copy-Item -Path "${{ env.OPENSSL_ROOT_DIR }}/bin/*" -Include libcrypto*,libssl*,legacy* -Destination $out
        if (-not (Test-Path "$out/mmaps_generator.exe")) { throw "mmaps_generator.exe was not built" }
        Get-ChildItem $out

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        path: ${{ github.workspace }}/mmaps-tools
        name: mmaps-tools-win64
